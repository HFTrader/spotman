# Compute Optimized - AWS Graviton4 (c8g.2xlarge)
# Best price-performance for compute-intensive workloads
# 8 vCPUs, 16 GB RAM, ARM64, DDR5

# Instance configuration
instance_type: "c8g.2xlarge"
spot_instance: true
hibernation_enabled: true
ami_id: "ami-01da1dbf9ea3a6ee6"  # Ubuntu 24.04 LTS ARM64 (Noble) - us-east-2

# Storage configuration
# 16 GB RAM requires ~20 GB disk for hibernation, plus space for OS/work
root_volume_size: 60  # GB - 16 GB for RAM hibernate + space for work
root_volume_type: "gp3"
root_volume_encrypted: true  # Required for hibernation

# Operating system configuration
os_type: "ubuntu"
update_os: true

# Tags
tags:
  ApplicationClass: "compute"
  Environment: "experiment"
  InstanceType: "spot"
  Purpose: "compute-workload"
  Architecture: "graviton4"
  Year: "2024"
  ManagedBy: "spotman"

# Notes:
# - AWS Graviton4 (ARM64)
# - 8 vCPUs, 16 GB RAM
# - Best price-performance in EC2 for compute workloads
# - Up to 30% better performance than C7g
# - DDR5 memory, enhanced memory bandwidth
# - Requires ARM64-compatible software
#
# Usage:
#   ./spotman create --profile compute-c8g --name c8g-compute01
