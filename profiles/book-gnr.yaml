# Book box - AWS c8i.metal-48xl (spot), an Intel machine for the Measured volumes (Low Latency Trading Insights, Vol. 3)
# Granite Rapids (Xeon 6, 2 x 48 cores): a current Intel core beside the Skylake-SP box. Spot was $0.93/h in us-west-2c on 2026-11-28 ($1.88 in us-west-2d).
# Written 2026-11-28 from book-zen5 (same image, same first-boot script, same isolation kit, same rules:
# run from the laptop only, box names book-*, us-west-2, never us-east-1c, price told and OK'd first,
# poweroff backstop, terminate and confirm). The author OK'd this type on 2026-11-28 ("let's do both c5n and c8i").
# The isolation plan is whatever plan-isolation.py gives with 8 housekeeping cores: isolated cores in both
# sockets, the hyper-thread siblings of isolated cores offline, turbo off, frequency pinned.

instance_type: "c8i.metal-48xl"
spot_instance: true
hibernation_enabled: false
spot_price: 2.50                    # cap, USD/h; see the note above for the price seen on 2026-11-28

# Ubuntu 26.04 build 20261120, the build of ami-0c30b7300f5fb34cd (us-east-1, kernel 7.0.0-1018-aws)
# that the 2026-11-25 leg ran on. This id is the same build in us-west-2.
ami_id: "ami-0087d113babc82cbe"     # us-west-2 only
ami_name: "ubuntu/images/hvm-ssd-gp3/ubuntu-resolute-26.04-amd64-server-20261120"
os_type: "ubuntu"
update_os: false

root_volume_size: 40
root_volume_type: "gp3"
root_volume_encrypted: false

# The laptop's key for us-west-2 (regions.yaml default_key) and a group that admits SSH
# from the laptop's address only. Not the rounds' zen5-round key or group.
key_name: "amz-sp"
security_groups: ["book-zen5"]

shutdown_behavior: "terminate"

# First boot as for zen5-c8a-metal: self-poweroff (6 h, pulled in to 4 h below), irqbalance off,
# perf_event_paranoid 1, g++-14.
user_data: !include ../scripts/zen5-metal-setup.sh

setup_steps:
  - name: first-boot setup finished
    wait_for: test -e /var/lib/zen5-setup-done
    timeout: 1200
  - name: poweroff backstop 4 h from now
    run: |
      echo $(( $(date +%s) + 4*3600 )) | sudo tee /etc/spotman-deadline >/dev/null
      echo "poweroff backstop at $(date -u -d @$(cat /etc/spotman-deadline))"
  - name: copy the isolation kit
    copy: {src: ~/git/tests/cpu-isolation, dest: ~/tmp/cpu-isolation}
  - name: plan and apply isolation (8 housekeeping cores, the rest isolated in both sockets, 2048 hugepages)
    skip_if: grep -q isolcpus= /proc/cmdline
    run: |
      cd ~/tmp/cpu-isolation
      python3 plan-isolation.py --housekeeping 8 --human | tee ~/tmp/isolation-plan.txt
      eval "$(python3 plan-isolation.py --housekeeping 8 --shell)"
      [ -n "$ISOL_CORES" ] || { echo "empty isolation plan"; exit 1; }
      if grep -q '^GRUB_CMDLINE_LINUX=.*isolcpus' /etc/default/grub; then
        echo "GRUB already has isolcpus but the running kernel does not"; exit 1
      fi
      sudo env ISOL_CORES="$ISOL_CORES" HOUSEKEEPING_LIST="$HOUSEKEEPING_LIST" HUGEPAGES_2M=2048 \
        bash setup-isolation.sh | grep -E "Isolated|Housekeeping|Added to GRUB|enabled|complete"
  - name: reboot into the isolated kernel command line (metal, 3-5 min)
    skip_if: grep -q isolcpus= /proc/cmdline
    reboot: true
    timeout: 1200
  - name: move stray IRQs to the housekeeping cores and verify isolation
    run: |
      hk=$(grep -o 'irqaffinity=[^ ]*' /proc/cmdline | cut -d= -f2)
      for d in /proc/irq/[0-9]*; do
        e=$(cat $d/effective_affinity_list 2>/dev/null) || continue
        python3 -c "import sys
        def ex(s):
            o=set()
            for a in s.split(','):
                if a: lo,_,hi=a.partition('-'); o.update(range(int(lo),int(hi or lo)+1))
            return o
        sys.exit(0 if ex(sys.argv[1]) & ex(open('/sys/devices/system/cpu/isolated').read().strip()) else 1)" "$e" \
          && { echo "$hk" | sudo tee $d/smp_affinity_list >/dev/null 2>&1 || true; }
      done
      (cd ~/tmp/cpu-isolation && sudo bash verify-isolation.sh 2>&1 | grep -E "PASS|FAIL|passed") || true
      grep -q 'isolcpus=managed_irq,domain,' /proc/cmdline || { echo "isolcpus not active"; exit 1; }
      if [ -r /sys/devices/system/cpu/intel_pstate/no_turbo ]; then [ "$(cat /sys/devices/system/cpu/intel_pstate/no_turbo)" = 1 ] || { echo "turbo still on"; exit 1; }; fi
      grep -q 'HugePages_Total: *2048' /proc/meminfo || { echo "hugepages not reserved"; exit 1; }
      echo "isolated: $(cat /sys/devices/system/cpu/isolated); no_turbo=$(cat /sys/devices/system/cpu/intel_pstate/no_turbo 2>/dev/null); 2048 hugepages"
      echo "poweroff backstop at $(date -u -d @$(cat /etc/spotman-deadline))"
  - name: book toolchain (clang-20, cmake, perf) and the counter check
    run: |
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang-20 libc++-20-dev libc++abi-20-dev cmake xz-utils "linux-tools-$(uname -r)" >/dev/null
      g++-14 --version | head -1; clang++-20 --version | head -1; cmake --version | head -1
      perf stat -e cycles,instructions,cache-misses true 2>&1 | grep -E "cycles|instructions|cache-misses"
  - name: machine record for the book
    run: |
      mkdir -p ~/tmp/book
      { date -u; uname -a; lscpu | grep -E "Model name|^CPU\(s\)|Thread|MHz|boost"
        echo "no_turbo: $(cat /sys/devices/system/cpu/intel_pstate/no_turbo 2>/dev/null); boost: $(cat /sys/devices/system/cpu/cpufreq/boost 2>/dev/null)"
        echo "isolated: $(cat /sys/devices/system/cpu/isolated)"
        c=$(cut -d- -f1 /sys/devices/system/cpu/isolated | cut -d, -f1); echo "cpu$c governor $(cat /sys/devices/system/cpu/cpu$c/cpufreq/scaling_governor), driver $(cat /sys/devices/system/cpu/cpu$c/cpufreq/scaling_driver), min/max $(cat /sys/devices/system/cpu/cpu$c/cpufreq/scaling_min_freq)/$(cat /sys/devices/system/cpu/cpu$c/cpufreq/scaling_max_freq) kHz, cur $(cat /sys/devices/system/cpu/cpu$c/cpufreq/scaling_cur_freq) kHz"
        sudo dmesg | grep -iE "tsc.*(MHz|calibrat|clocksource)" | tail -3
        echo "clocksource: $(cat /sys/devices/system/clocksource/clocksource0/current_clocksource)"
        cat /proc/cmdline
        g++-14 --version | head -1; clang++-20 --version | head -1
      } > ~/tmp/book/machine.txt
      cat ~/tmp/book/machine.txt

tags:
  ApplicationClass: "benchmark"
  Environment: "experiment"
  InstanceType: "spot"
  Purpose: "book-measured"
  Architecture: "granite-rapids"
  ManagedBy: "spotman"

# Usage (from the laptop, never from hz2):
#   ./spotman --region us-west-2 price --profile book-gnr
#   ./spotman --region us-west-2 create --profile book-gnr --alias book-gnr --class benchmark --az <zone>
#   ssh spotman-book-gnr                      # work in ~/tmp/book/
#   ./spotman --region us-west-2 terminate book-gnr     # then confirm in the EC2 API
